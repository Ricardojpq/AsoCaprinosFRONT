<div class="card">
  <!-- Tabs principales -->
  <p-tabs 
    [value]="activeTabIndex.toString()"
    (onTabChange)="onTabChange($event)">
    
    <p-tablist>
      <p-tab value="0">
        Países
      </p-tab>
      <p-tab value="1">
        Estados
      </p-tab>
      <p-tab value="2">
        Municipios
      </p-tab>
      <p-tab value="3">
        Parroquias
      </p-tab>
      <p-tab value="4">
        Ciudades
      </p-tab>
    </p-tablist>

    <p-tabpanels>
      <!-- Panel Países -->
      <p-tabpanel value="0">
        <app-countries-tab
          [canCreate]="canCreate()"
          [canUpdate]="canUpdate()"
          [canDelete]="canDelete()"
          (dataChanged)="refreshCurrentTab()">
        </app-countries-tab>
      </p-tabpanel>

      <!-- Panel Estados -->
      <p-tabpanel value="1">
        <app-states-tab
          [canCreate]="canCreate()"
          [canUpdate]="canUpdate()"
          [canDelete]="canDelete()"
          (dataChanged)="refreshCurrentTab()">
        </app-states-tab>
      </p-tabpanel>

      <!-- Panel Municipios -->
      <p-tabpanel value="2">
        <app-municipalities-tab
          [canCreate]="canCreate()"
          [canUpdate]="canUpdate()"
          [canDelete]="canDelete()"
          (dataChanged)="refreshCurrentTab()">
        </app-municipalities-tab>
      </p-tabpanel>

      <!-- Panel Parroquias -->
      <p-tabpanel value="3">
        <app-parishes-tab
          [canCreate]="canCreate()"
          [canUpdate]="canUpdate()"
          [canDelete]="canDelete()"
          (dataChanged)="refreshCurrentTab()">
        </app-parishes-tab>
      </p-tabpanel>

      <!-- Panel Ciudades -->
      <p-tabpanel value="4">
        <app-cities-tab
          [canCreate]="canCreate()"
          [canUpdate]="canUpdate()"
          [canDelete]="canDelete()"
          (dataChanged)="refreshCurrentTab()">
        </app-cities-tab>
      </p-tabpanel>
    </p-tabpanels>

  </p-tabs>

</div>
