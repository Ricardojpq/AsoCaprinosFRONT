<div
  class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-[100vw] overflow-hidden"
>
  <div class="flex flex-col items-center justify-center">
    <div
      style="
        border-radius: 56px;
        padding: 0.3rem;
        background: linear-gradient(
          180deg,
          var(--primary-color) 10%,
          rgba(33, 150, 243, 0) 30%
        );
      "
    >
      <div
        class="w-full bg-surface-0 dark:bg-surface-900 py-20 px-8 sm:px-20"
        style="border-radius: 53px"
      >
        <div class="flex flex-col justify-center items-center gap-4">
          <img
            src="assets/logos/logo.png"
            alt="ASOCABRA Logo"
            class="size-[200px] object-cover rounded-[50%] bg-golden-50"
          />
          <div
            class="text-surface-900 dark:text-surface-0 text-3xl font-medium text-center"
          >
            Bienvenidos al sistema administrativo de AsoCabra
          </div>
          <span class="text-muted-color font-medium">Inicia Sesión para continuar</span>
        </div>

        <!-- Mensaje de error -->
        @if (error()) {
          <p-message 
            severity="error"        
            styleClass="my-6"
            [closable]="false">
            {{error() || ''}}
          </p-message>
        }

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <div>
            <label
              for="email1"
              class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2"
              >Email</label
            >
            <input
              pInputText
              id="email1"
              type="text"
              placeholder="Email address"
              class="!w-full md:w-[30rem] mb-8"
              formControlName="email"
              (input)="onInputChange()"
              [class]="email?.invalid && email?.touched ? 'p-invalid' : ''"
            />

            <label
              for="password1"
              class="block text-surface-900 dark:text-surface-0 font-medium text-xl mb-2"
              >Password</label
            >
            <p-password
              id="password1"
              placeholder="Password"
              [toggleMask]="true"
              class="mb-4"
              [fluid]="true"
              [feedback]="false"
              formControlName="password"
              (input)="onInputChange()"
              [invalid]="password?.invalid && password?.touched"
            ></p-password>

            <div class="flex items-center justify-between mt-2 mb-8 gap-8">
              <div class="flex items-center">
                <p-checkbox
                  formControlName="rememberMe"
                  id="rememberme1"
                  binary
                  class="mr-2"
                ></p-checkbox>
                <label for="rememberme1">Remember me</label>
              </div>
              <span
                class="font-medium no-underline ml-2 text-right cursor-pointer text-primary"
                >Forgot password?</span
              >
            </div>
            <p-button
              label="Sign In"
              styleClass="w-full btn btn-primary btn-sm"
              type="submit"
              [disabled]="loginForm.invalid || loading()"
            ></p-button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Loading overlay para el login -->
@if (loading()) {
  <div class="fixed inset-0 bg-black/30 backdrop-blur-sm flex items-center justify-center z-50">
    <div class="bg-white/90 backdrop-blur-md rounded-xl p-8 flex flex-col items-center shadow-2xl">
      <img src="assets/logos/logo.png" alt="ASOCABRA Logo" class="w-16 h-16 mb-4" />
      <p-progressSpinner class="w-8 h-8" strokeWidth="4" fill="var(--surface-ground)" animationDuration=".5s"></p-progressSpinner>
      <p class="mt-4 text-gray-700 font-medium">Iniciando sesión...</p>
    </div>
  </div>
}
