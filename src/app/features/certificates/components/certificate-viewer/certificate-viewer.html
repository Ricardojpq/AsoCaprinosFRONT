<div class="certificate-viewer-container">
  <!-- Contenedor del PDF -->
  <div class="pdf-preview-container">
    <!-- Loading Spinner -->
    @if (isLoading) {
    <div class="loading-container">
      <div class="flex flex-col items-center">
        <div
          class="animate-spin rounded-full h-16 w-16 border-b-2 border-golden-700 mb-4"
        ></div>
        <p class="text-gray-600 text-lg">Generando certificado PDF...</p>
        <p class="text-gray-500 text-sm">
          Por favor espere mientras se procesa el documento
        </p>
      </div>
    </div>
    } @if (pdfUrl && !isLoading && !error) {
    <div class="pdf-embed-container">
      <iframe
        [src]="pdfUrl"
        width="100%"
        height="100%"
        frameborder="0"
        class="rounded-lg shadow-lg"
      >
      </iframe>
    </div>
    }
  </div>

  <!-- Elementos ocultos para generación de PDF -->
  <div class="offscreen">
    <div #certificatePage1>
      <app-certificate-page1 
        [certificateData]="certificateData"
        (dataLoaded)="onPage1DataLoaded()">
      </app-certificate-page1>
    </div>
    <div #certificatePage2>
      <app-certificate-page2 
        [certificateData]="certificateData"
        (dataLoaded)="onPage2DataLoaded()">
      </app-certificate-page2>
    </div>
  </div>
</div>
