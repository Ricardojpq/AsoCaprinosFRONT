<div class="card">
  <p-toast />
  <p-toolbar class="mb-6">
    <ng-template #start>
      <p-button
        styleClass="gap-1 btn btn-primary btn-sm"
        label="New"
        icon="pi pi-plus"
        class="mr-2"
        (onClick)="openNew()"
      >
      <lucide-icon [img]="plusIcon" size="16"></lucide-icon>
    </p-button>
      <p-button
        styleClass="gap-1 btn btn-danger btn-sm"
        severity="danger"
        label="Delete"
        icon="pi pi-trash"
        outlined
        (onClick)="deleteSelectedProducts()"
        [disabled]="!selectedProducts || !selectedProducts.length"
      >
       <lucide-icon [img]="trashIcon" size="16"></lucide-icon>
    </p-button>
    </ng-template>

    <ng-template #end>
      <p-fileUpload
      
        mode="basic"
        accept="image/*"
        [maxFileSize]="1000000"
        label="Import"
        chooseLabel="Import"
        auto
        customUpload
        class="mr-2 inline-block"
        [chooseButtonProps]="{ severity: 'secondary' }"
      />
      <p-button
        styleClass="btn btn-secondary btn-sm"
        label="Export"
        severity="secondary"
        (onClick)="exportCSV($event)"
      >
      <lucide-icon [img]="uploadIcon" size="16"></lucide-icon>
    </p-button>
    </ng-template>
  </p-toolbar>

  <p-table
    #dt
    [value]="products"
    [rows]="10"
    [columns]="cols"
    [paginator]="true"
    [globalFilterFields]="[
      'name',
      'country.name',
      'representative.name',
      'status'
    ]"
    [tableStyle]="{ 'min-width': '75rem' }"
    [(selection)]="selectedProducts"
    [rowHover]="true"
    dataKey="id"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    [showCurrentPageReport]="true"
    [rows]="1"
  > 
    <ng-template #caption>
      <div class="flex items-center justify-between">
        <h5 class="m-0">Manage Products</h5>
        <p-iconfield >
          <p-inputicon >
              <lucide-angular [img]="searchIcon" size="16"></lucide-angular>
          </p-inputicon>
          <input pInputText type="text" placeholder="Search..."  class="focus:border-golden-500"/>
        </p-iconfield>
      </div>
    </ng-template>
    <ng-template #header>
      <tr>
        <th style="width: 3rem">
          <p-tableHeaderCheckbox />
        </th>
        <th style="min-width: 16rem">Code</th>
        <th class="hover:bg-golden-100" pSortableColumn="name" style="min-width: 16rem">
          <div class="flex items-center gap-2">
            Name
            <p-sortIcon field="name" />
          </div>
        </th>
        <th class="hover:bg-golden-100" pSortableColumn="price" style="min-width: 8rem">
          <div class="flex items-center gap-2">
            Price
            <p-sortIcon field="price" />
          </div>
        </th>
        <th class="hover:bg-golden-100" pSortableColumn="category" style="min-width: 10rem">
          <div class="flex items-center gap-2">
            Category
            <p-sortIcon field="category" />
          </div>
        </th>
        <th class="hover:bg-golden-100" pSortableColumn="inventoryStatus" style="min-width: 12rem">
          <div class="flex items-center gap-2">
            Status
            <p-sortIcon field="inventoryStatus" />
          </div>
        </th>
        <th style="min-width: 12rem"></th>
      </tr>
    </ng-template>
    <ng-template #body let-product>
      <tr>
        <td style="width: 3rem">
          <p-tableCheckbox [value]="product" class=""/>
        </td>
        <td style="min-width: 12rem">{{ product.code }}</td>
        <td style="min-width: 16rem">{{ product.name }}</td>
        <td>{{ product.price | currency : "USD" }}</td>
        <td>{{ product.category }}</td>
        <td>
          <p-tag
            [value]="product.inventoryStatus"
            [severity]="getSeverity(product.inventoryStatus)"
          />
        </td>
        <td>
          <p-button
            class="mr-2"
            [rounded]="true"
            [outlined]="true"
            (click)="editProduct(product)"
          >
            <lucide-icon [img]="pencilIcon" size="18"></lucide-icon>
          </p-button>
          <p-button
            severity="danger"
            [rounded]="true"
            [outlined]="true"
            (click)="deleteProduct(product)"
          >
            <lucide-icon [img]="trashIcon" size="18"></lucide-icon>
          </p-button>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog
    [(visible)]="productDialog"
    [style]="{ width: '450px' }"
    header="Product Details"
    [modal]="true"
  >
    <ng-template #content>
      <div class="flex flex-col gap-6">
        <div>
          <label for="name" class="block font-bold mb-3">Name</label>
          <input
            type="text"
            pInputText
            id="name"
            [(ngModel)]="product.name"
            required
            autofocus
            fluid
          />
          @if (submitted && !product.name) {
            <small class="text-red-500">Name is required.</small>
          }
        </div>
        <div>
          <label for="description" class="block font-bold mb-3"
            >Description</label
          >
          <textarea
            id="description"
            pTextarea
            [(ngModel)]="product.description"
            required
            rows="3"
            cols="20"
            fluid
          ></textarea>
        </div>

        <div>
          <label for="inventoryStatus" class="block font-bold mb-3"
            >Inventory Status</label
          >
          <p-select
            [(ngModel)]="product.inventoryStatus"
            inputId="inventoryStatus"
            [options]="statuses"
            optionLabel="label"
            placeholder="Select a Status"
            fluid
          />
        </div>

        <div>
          <span class="block font-bold mb-4">Category</span>
          <div class="grid grid-cols-12 gap-4">
            <div class="flex items-center gap-2 col-span-6">
              <p-radiobutton
                id="category1"
                name="category"
                value="Accessories"
                [(ngModel)]="product.category"
              />
              <label for="category1">Accessories</label>
            </div>
            <div class="flex items-center gap-2 col-span-6">
              <p-radiobutton
                id="category2"
                name="category"
                value="Clothing"
                [(ngModel)]="product.category"
              />
              <label for="category2">Clothing</label>
            </div>
            <div class="flex items-center gap-2 col-span-6">
              <p-radiobutton
                id="category3"
                name="category"
                value="Electronics"
                [(ngModel)]="product.category"
              />
              <label for="category3">Electronics</label>
            </div>
            <div class="flex items-center gap-2 col-span-6">
              <p-radiobutton
                id="category4"
                name="category"
                value="Fitness"
                [(ngModel)]="product.category"
              />
              <label for="category4">Fitness</label>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-12 gap-4">
          <div class="col-span-6">
            <label for="price" class="block font-bold mb-3">Price</label>
            <p-inputnumber
              id="price"
              [(ngModel)]="product.price"
              mode="currency"
              currency="USD"
              locale="en-US"
              fluid
            />
          </div>
          <div class="col-span-6">
            <label for="quantity" class="block font-bold mb-3">Quantity</label>
            <p-inputnumber id="quantity" [(ngModel)]="product.quantity" fluid />
          </div>
        </div>
      </div>
    </ng-template>

    <ng-template #footer>
      <p-button label="Cancel" icon="pi pi-times" text (click)="hideDialog()" />
      <p-button label="Save" icon="pi pi-check" (click)="saveProduct()" />
    </ng-template>
  </p-dialog>

  <p-confirmDialog [style]="{ width: '450px' }" />
</div>
